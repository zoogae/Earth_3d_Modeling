
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Earth 3D Modeling</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050b17;
            color: #e4efff;
            font-family: 'Malgun Gothic', sans-serif;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        #sunControl {
            position: absolute;
            top: 120px;
            left: 28px;

            /* 기존 320px → 290px */
            width: 290px;
            padding: 12px 14px;

            background: rgba(73, 80, 95, 0.78);
            border: 1px solid rgba(255, 253, 253, 0.18);
            border-radius: 12px;

            color: #dcd5d5;
            font-size: 13px;
            box-sizing: border-box;
        }
        #sunControl label {
            display: block;
            margin-bottom: 10px;
        }

        #sunAngle {
            display: block;
            width: 100%;
            cursor: pointer;
            accent-color: #ecc67a;
        }

        #miniMap {
            display: block;
            width: 100%;
            height: 155px;

            margin-top: 13px;

            background: #ececec;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;

            box-sizing: border-box;
        }
        #info {
            position: absolute;
            top: 24px;
            left: 28px;
            pointer-events: none;
            text-shadow: 0 2px 10px #000;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 23px;
            letter-spacing: 0.04em;
        }

        p {
            margin: 4px 0;
            color: #bdcde2;
            font-size: 13px;
        }

        #status {
            position: absolute;
            bottom: 22px;
            left: 28px;
            color: #a7bed8;
            font-size: 12px;
            max-width: 80vw;
        }

        /* 기본 마우스 포인터 */
        #gl {
            cursor: grab;
            touch-action: none;
        }

        /* 지구를 드래그하는 동안 */
        #gl:active {
            cursor: grabbing;
        }

        #help {
            position: absolute;
            bottom: 20px;
            right: 28px;
            color: #a7bed8;
            font-size: 12px;
            text-align: right;
        }

        kbd {
            border: 1px solid #53667f;
            border-radius: 3px;
            padding: 2px 4px;
        }
    </style>
</head>

<body>

    <!-- 지구 렌더링 Canvas -->
    <canvas id="gl"></canvas>

    <!-- 태양 방향, 밝기 제어 -->
    <div id="sunControl">
        <label for="sunAngle">
            태양 방향:
            <span id="sunAngleValue">0°</span>
        </label>

        <input
            id="sunAngle"
            type="range"
            min="-180"
            max="180"
            value="0"
            step="1"
        />
        <canvas id="miniMap" width="290" height="155"></canvas>
    </div>

    <div id="info">
        <h1>Earth 3D Modeling</h1>
        <p>고도 기반 3D 지구 · WebGL / GLSL</p>
        <p>자동 자전 · 23.4° 자전축</p>
    </div>

    <!-- 이미지 및 지구 모델 로딩 상태 -->
    <div id="status">
        리소스를 불러오는 중...
    </div>

    <!-- 키보드, 마우스 안내 -->
    <div id="help">
        드래그: 지구 회전  
        <br>휠: 확대/축소
        <br><kbd>Space</kbd> 자전 일시정지
        <br><kbd>R</kbd> 시점 초기화
    </div>

    <!-- WebGL 프로그램 -->
    <script src="main.js"></script>

</body>
</html>
